{% extends "base.html" %} {% block content %}

<h2>Reporte de Clientes</h2>

<table border="1" width="100%">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Dirección</th>
      <th>Teléfono</th>
      <th>Correo</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody>
    {% for c in clientes %}
    <tr>
      <td>{{ c.nombre }}</td>
      <td>{{ c.direccion }}</td>
      <td>{{ c.telefono }}</td>
      <td>{{ c.correo }}</td>
      <td>{{ c.estado }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
