{% extends "base.html" %} {% block content %}

<div class="page-header mb-4">
  <div class="d-flex align-items-center">
    <i class="fas fa-receipt fa-2x text-primary me-3"></i>
    <div>
      <h1 class="mb-0">Centro de Facturación</h1>
      <p class="text-muted mb-0">Cree y gestione sus facturas de venta</p>
    </div>
  </div>
</div>

<div class="row g-3">
  <div class="col-md-6">
    <a href="{% url 'crear_factura' %}" class="card shadow-sm text-decoration-none h-100 menu-card invoice-card">
      <div class="card-body text-center py-5">
        <div class="card-icon mb-3" style="margin: 0 auto 1.5rem;">
          <i class="fas fa-file-invoice fa-3x"></i>
        </div>
        <h5 class="card-title">Crear Nueva Factura</h5>
        <p class="card-text text-muted mb-0">Genere una nueva factura de venta para sus clientes</p>
      </div>
    </a>
  </div>
  
  <div class="col-md-6">
    <a href="{% url 'ventas' %}" class="card shadow-sm text-decoration-none h-100 menu-card sales-card">
      <div class="card-body text-center py-5">
        <div class="card-icon mb-3" style="margin: 0 auto 1.5rem;">
          <i class="fas fa-chart-line fa-3x"></i>
        </div>
        <h5 class="card-title">Reporte de Ventas</h5>
        <p class="card-text text-muted mb-0">Consulte el historial de ventas y facturas emitidas</p>
      </div>
    </a>
  </div>
</div>

{% endblock %}
