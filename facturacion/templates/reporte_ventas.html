{% extends "base.html" %} {% block content %}

<h2>Reporte de Ventas</h2>

<table border="1" width="100%">
  <thead>
    <tr>
      <th>Número</th>
      <th>Fecha</th>
      <th>Cliente</th>
      <th>Total</th>
    </tr>
  </thead>
  <tbody>
    {% for v in ventas %}
    <tr>
      <td>{{ v.numero_factura }}</td>
      <td>{{ v.fecha }}</td>
      <td>{{ v.cliente.nombre }}</td>
      <td>{{ v.total }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
