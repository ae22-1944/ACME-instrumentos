{% extends "base.html" %} {% block content %}
<h2>Facturación</h2>

<form method="POST" id="factura-main-form">
  {% csrf_token %}

  <h3>Información Cliente</h3>

  <div>
    <label>Cliente</label>
    {{ factura_form.cliente }}
  </div>

  <div id="info-cliente" style="margin: 8px 0; font-size: 0.95rem; color: #555">
    <!-- Se llenará dinámicamente por JS al cambiar cliente -->
  </div>

  <div>
    <label>Método de pago</label>
    {{ factura_form.metodo_pago }}
  </div>

  <hr />

  <h3>Añadir Productos</h3>

  <div style="display: flex; gap: 8px; align-items: center">
    <select name="producto">
      <option value="0">-- Seleccione --</option>
      {% for p in productos %}
      <option
        value="{{ p.id_producto }}"
        data-precio="{{ p.precio_unitario }}"
        data-stock="{{p.stock_actual}}"
        data-minimo="{{p.stock_minimo}}"
      >
        {{ p.nombre }}
      </option>
      {% endfor %}
    </select>

    <input type="number" name="cantidad" min="1" value="1" />

    <button type="button" id="btn-add-item">Añadir</button>
  </div>

  <table id="lista-productos" style="width: 100%; margin-top: 12px">
    <thead>
      <tr>
        <th>Acción</th>
        <th>Producto</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Subtotal</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <input type="hidden" name="items" id="items-data" value="[]" />

  <hr />

  <div style="text-align: right">
    <div>Subtotal: <span id="display-subtotal">RD$ 0.00</span></div>
    <div>ITBIS (<span id="itbis-rate">18</span>%): <span id="display-itbis">RD$ 0.00</span></div>
    <div>Total: <span id="display-total">RD$ 0.00</span></div>
  </div>

  <div>
    <button type="submit">Guardar Factura</button>
  </div>
</form>

<script>
  /* Lógica JS: manejar lista de items y calculos */
  const items = [];
  const itemsInput = document.getElementById('items-data');
  const tbody = document.querySelector('#lista-productos tbody');
  const btnAdd = document.getElementById('btn-add-item');

  function formatMoney(n) {
    return new Intl.NumberFormat('es-DO', { style: 'currency', currency: 'DOP' }).format(n);
  }

  function recalcTotals() {
    const subtotal = items.reduce((s, i) => s + Number(i.subtotal), 0);
    const ITBIS_RATE = Number(document.getElementById('itbis-rate').textContent) / 100;
    const itbis = +(subtotal * ITBIS_RATE);
    const total = +(subtotal + itbis);
    document.getElementById('display-subtotal').textContent = formatMoney(subtotal);
    document.getElementById('display-itbis').textContent = formatMoney(itbis);
    document.getElementById('display-total').textContent = formatMoney(total);
    itemsInput.value = JSON.stringify(items);
  }

  function renderItems() {
    tbody.innerHTML = '';
    items.forEach((it, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
      <td style="text-align:center;"><button type="button" data-idx="${idx}" class="btn-remove">Eliminar</button></td>
      <td style="text-align:center;">${it.producto_name}</td>
      <td style="text-align:right;">${formatMoney(it.precio_unitario)}</td>
      <td style="text-align:center;">${it.cantidad}</td>
      <td style="text-align:right;">${formatMoney(it.subtotal)}</td>
      
    `;
      tbody.appendChild(tr);
    });

    document.querySelectorAll('.btn-remove').forEach((b) => {
      b.onclick = (e) => {
        const idx = Number(e.target.dataset.idx);
        items.splice(idx, 1);
        renderItems();
        recalcTotals();
      };
    });
  }

  btnAdd.onclick = () => {
    const prodSelect = document.querySelector("[name='producto']");
    const qtyInput = document.querySelector("[name='cantidad']");

    const producto_id = prodSelect.value;
    const selected = prodSelect.options[prodSelect.selectedIndex];
    const producto_name = selected ? selected.text : '';
    const cantidad = parseInt(qtyInput.value || '0');
    let stock = selected ? parseInt(selected.dataset.stock) : 0;
    const minimo = selected ? parseInt(selected.dataset.minimo) : 0;

    if (producto_id === '0' || !selected || cantidad <= 0) {
      return alert('Seleccione producto y cantidad válida.');
    }

    const existing = items.find((i) => i.producto_id === producto_id);
    const totalRequested = existing ? existing.cantidad + cantidad : cantidad;

    if (totalRequested > stock) {
      return alert(`No puedes agregar ${totalRequested} unidades. Solo hay ${stock} disponibles.`);
    }

    if (stock - totalRequested <= minimo) {
      alert(
        `Atención: este producto está llegando al mínimo. Quedarán ${
          stock - totalRequested
        } unidades.`,
      );
    }

    const precio_unitario = parseFloat(selected.dataset.precio || '0');

    if (existing) {
      existing.cantidad += cantidad;
      existing.subtotal = existing.cantidad * precio_unitario;
    } else {
      items.push({
        producto_id,
        producto_name,
        cantidad,
        precio_unitario,
        subtotal: cantidad * precio_unitario,
      });
    }

    renderItems();
    recalcTotals();

    qtyInput.value = 1;
  };
</script>
{% endblock %}
