{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACME - Iniciar Sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="{% static 'styles.css' %}" />
    <style>
      /* Login Page Styles */
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
      }

      .login-wrapper {
        width: 100%;
        max-width: 450px;
        padding: 20px;
      }

      .login-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        animation: slideUp 0.6s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-header {
        background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
        color: white;
        padding: 40px 30px;
        text-align: center;
      }

      .login-header h1 {
        font-size: 2.5rem;
        font-weight: bold;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .login-header p {
        font-size: 0.95rem;
        opacity: 0.9;
        margin: 0;
      }

      .login-body {
        padding: 40px 30px;
      }

      .form-group {
        margin-bottom: 25px;
      }

      .form-label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #333;
        font-size: 0.95rem;
      }

      .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background-color: #f8f9fa;
      }

      .form-control:focus {
        outline: none;
        border-color: #0d6efd;
        background-color: white;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
      }

      .form-control::placeholder {
        color: #999;
      }

      .input-group {
        position: relative;
      }

      .input-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #0d6efd;
        pointer-events: none;
      }

      .input-group .form-control {
        padding-right: 45px;
      }

      .login-button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 15px;
      }

      .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(13, 110, 253, 0.3);
      }

      .login-button:active {
        transform: translateY(0);
      }

      .login-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .error-message {
        background-color: #f8d7da;
        color: #721c24;
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 25px;
        border-left: 4px solid #dc3545;
        display: flex;
        align-items: center;
        gap: 10px;
        animation: slideDown 0.4s ease-out;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .error-message i {
        font-size: 1.2rem;
      }

      .remember-forgot {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        margin-bottom: 25px;
        font-size: 0.9rem;
      }

      .remember-me {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .remember-me input[type='checkbox'] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #0d6efd;
      }

      .remember-me label {
        margin: 0;
        cursor: pointer;
        color: #555;
      }

      .login-footer {
        background-color: #f8f9fa;
        padding: 20px 30px;
        text-align: center;
        border-top: 1px solid #e0e0e0;
        font-size: 0.9rem;
        color: #666;
      }

      .feature-list {
        display: flex;
        gap: 15px;
        margin-top: 20px;
        font-size: 0.85rem;
      }

      .feature-item {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #666;
      }

      .feature-item i {
        color: #0d6efd;
        font-size: 1.1rem;
      }

      /* Loading animation */
      .btn-loading {
        pointer-events: none;
      }

      .spinner-border-sm {
        width: 1rem;
        height: 1rem;
      }

      /* Password strength indicator */
      .password-strength {
        height: 3px;
        background-color: #e0e0e0;
        border-radius: 3px;
        margin-top: 8px;
        overflow: hidden;
      }

      .password-strength-bar {
        height: 100%;
        width: 0;
        transition: width 0.3s ease, background-color 0.3s ease;
      }

      /* Responsive */
      @media (max-width: 576px) {
        .login-wrapper {
          padding: 15px;
        }

        .login-header {
          padding: 30px 20px;
        }

        .login-header h1 {
          font-size: 2rem;
        }

        .login-body {
          padding: 30px 20px;
        }

        .feature-list {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <!-- Header -->
        <div class="login-header">
          <h1>
            <i class="fas fa-cube"></i>
            ACME
          </h1>
          <p>Sistema de Inventario y Facturación</p>
        </div>

        <!-- Body -->
        <div class="login-body">
          <!-- Error Message -->
          {% if form.errors %}
          <div class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <span>Usuario o contraseña inválidos. Por favor, intente de nuevo.</span>
          </div>
          {% endif %}

          <!-- Login Form -->
          <form method="post" id="loginForm">
            {% csrf_token %}

            <!-- Username Field -->
            <div class="form-group">
              <label for="{{ form.username.id_for_label }}" class="form-label">
                <i class="fas fa-user me-2"></i>Usuario
              </label>
              <div class="input-group">
                <input
                  type="text"
                  id="{{ form.username.id_for_label }}"
                  name="username"
                  class="form-control"
                  placeholder="Ingrese su usuario"
                  autocomplete="username"
                  required
                  autofocus
                />
                <i class="fas fa-user input-icon"></i>
              </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
              <label for="{{ form.password.id_for_label }}" class="form-label">
                <i class="fas fa-lock me-2"></i>Contraseña
              </label>
              <div class="input-group">
                <input
                  type="password"
                  id="{{ form.password.id_for_label }}"
                  name="password"
                  class="form-control"
                  placeholder="Ingrese su contraseña"
                  autocomplete="current-password"
                  required
                />
                <i class="fas fa-lock input-icon"></i>
              </div>
            </div>

            <!-- Login Button -->
            <button type="submit" class="login-button" id="submitBtn">
              <i class="fas fa-sign-in-alt"></i>
              Iniciar Sesión
            </button>

            <!-- Hidden input for next page -->
            <input type="hidden" name="next" value="{{ next }}" />
          </form>

          <!-- Features -->
          <div class="feature-list">
            <div class="feature-item">
              <i class="fas fa-boxes"></i>
              <span>Inventario</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-receipt"></i>
              <span>Facturación</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-chart-line"></i>
              <span>Reportes</span>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div class="login-footer">
          <p class="mb-0">
            <i class="fas fa-shield-alt me-2"></i>
            © 2025 ACME Instrumentos
          </p>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Form interactivity
      const loginForm = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const usernameInput = document.querySelector('[name="username"]');
      const passwordInput = document.querySelector('[name="password"]');

      // Show/Hide password
      function togglePassword() {
        const icon = document.querySelector('.fa-lock');
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          icon.classList.remove('fa-lock');
          icon.classList.add('fa-lock-open');
        } else {
          passwordInput.type = 'password';
          icon.classList.remove('fa-lock-open');
          icon.classList.add('fa-lock');
        }
      }

      // Add Enter key functionality
      document.addEventListener('keypress', function (event) {
        if (
          event.key === 'Enter' &&
          (event.target === usernameInput || event.target === passwordInput)
        ) {
          loginForm.submit();
        }
      });

      // Form submission
      loginForm.addEventListener('submit', function (e) {
        submitBtn.disabled = true;
        submitBtn.innerHTML =
          '<span class="spinner-border spinner-border-sm me-2"></span>Iniciando...';
      });

      // Restore button on page reload (if form submission fails)
      window.addEventListener('load', function () {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar Sesión';
      });

      // Focus animations
      usernameInput.addEventListener('focus', function () {
        this.parentElement.parentElement.querySelector('.form-label').style.color = '#0d6efd';
      });

      usernameInput.addEventListener('blur', function () {
        this.parentElement.parentElement.querySelector('.form-label').style.color = '#333';
      });

      passwordInput.addEventListener('focus', function () {
        this.parentElement.parentElement.querySelector('.form-label').style.color = '#0d6efd';
      });

      passwordInput.addEventListener('blur', function () {
        this.parentElement.parentElement.querySelector('.form-label').style.color = '#333';
      });

      // Add some keyboard shortcuts
      document.addEventListener('keydown', function (event) {
        // Alt + U for username field
        if (event.altKey && event.key === 'u') {
          usernameInput.focus();
          event.preventDefault();
        }
        // Alt + P for password field
        if (event.altKey && event.key === 'p') {
          passwordInput.focus();
          event.preventDefault();
        }
      });
    </script>
  </body>
</html>
