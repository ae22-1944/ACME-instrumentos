{% extends "base.html" %} {% block content %}

<h2>Reporte de Proveedores</h2>

<table border="1" width="100%">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Dirección</th>
      <th>Teléfono</th>
      <th>Correo</th>
    </tr>
  </thead>
  <tbody>
    {% for p in proveedores %}
    <tr>
      <td>{{ p.nombre }}</td>
      <td>{{ p.direccion }}</td>
      <td>{{ p.telefono }}</td>
      <td>{{ p.correo }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
